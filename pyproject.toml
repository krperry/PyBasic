[project]
name = "basic"
version = "0.1.0"
description = "Accessible BASIC environment with interpreter, runner, and BNS executor"
authors = [{ name = "Ken Perry" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame>=2.6.1", "numpy>=2.2.6"]

[project.scripts]
basic = "basic.basic:main"
dc = "disassembler.dc:main"
basic-bns = "basic_bns.basic_bns_runner:main"


[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
package-dir = "src"

[tool.pdm.scripts]
# Development scripts that work with the editable install
basic = {call = "basic.basic:main"}
dc = {call = "disassembler.dc:main"}
basic-bns = {call = "basic_bns.basic_bns_runner:main"}
